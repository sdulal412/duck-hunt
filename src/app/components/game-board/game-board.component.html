<div class="game-container">
  <app-intro-screen *ngIf="status === 'MENU'" (startGame)="onIntroStart()">
  </app-intro-screen>

  <canvas width="800" height="600" #gameCanvas (click)="handleShoot($event)">
  </canvas>

  <div *ngIf="showReloadUI" class="reload-overlay">
    <div class="menu-box">
      <h2>OUT OF AMMO!</h2>
      <button class="reload-btn" (click)="onReloadClick($event)">RELOAD</button>
      <p class="cost-text">COST: 500 PTS</p>
    </div>
  </div>
</div>
